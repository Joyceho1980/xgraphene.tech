<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ATP and Mitochondrial Energy Research</title>
  <desc id="desc">A scientific illustration of an ATP molecule, a research waveform, and a mitochondrion to represent the ATP study summary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="100%" stop-color="#E8EFF7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3348"/>
      <stop offset="100%" stop-color="#0E1B26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B1720" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F5F1EB"/>
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1460" height="760" rx="36" fill="#FFF"/>
  </g>
  <clipPath id="clip">
    <rect x="70" y="70" width="1460" height="760" rx="36"/>
  </clipPath>
  <g clip-path="url(#clip)">
    <rect x="70" y="70" width="1460" height="760" fill="url(#bg)"/>
    <circle cx="300" cy="160" r="84" fill="#F7D77D" opacity="0.42" filter="url(#soft)"/>
    <circle cx="1300" cy="180" r="90" fill="#5BB7F1" opacity="0.16" filter="url(#soft)"/>

    <g transform="translate(140 214)">
      <rect x="0" y="0" width="510" height="392" rx="32" fill="#FFF" stroke="#E5E5E7"/>
      <text x="30" y="44" fill="#1A3348" font-family="Urbanist, Inter, Arial, sans-serif" font-size="28" font-weight="300" letter-spacing="1">Study Focus</text>
      <circle cx="248" cy="200" r="92" fill="#EEF4FB" stroke="#C9D7E8"/>
      <circle cx="248" cy="200" r="58" fill="#C5A059" opacity="0.9"/>
      <circle cx="212" cy="178" r="7" fill="#FFF"/>
      <circle cx="284" cy="178" r="7" fill="#FFF"/>
      <circle cx="212" cy="222" r="7" fill="#FFF"/>
      <circle cx="284" cy="222" r="7" fill="#FFF"/>
      <text x="248" y="208" text-anchor="middle" fill="#FFF" font-family="Urbanist, Inter, Arial, sans-serif" font-size="34" font-weight="400">ATP</text>
      <text x="248" y="236" text-anchor="middle" fill="#FFF" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="1.2">energy currency</text>
      <path d="M88 110H420" stroke="#C5A059" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
      <path d="M88 280H420" stroke="#1A3348" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
      <text x="88" y="96" fill="#8A6D2F" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="1.1">MITOCHONDRIAL PATHWAYS</text>
      <text x="88" y="308" fill="#1A3348" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="1.1">RESEARCH OUTPUTS</text>
    </g>

    <g transform="translate(728 214)">
      <rect x="0" y="0" width="732" height="392" rx="32" fill="url(#panel)"/>
      <path d="M94 264C168 220 214 250 276 214C344 175 402 160 468 188C534 214 576 276 638 236" stroke="#C5A059" stroke-width="4" stroke-linecap="round"/>
      <path d="M94 220C166 184 222 182 286 214C344 244 402 248 468 218C528 192 576 188 638 216" stroke="#5BB7F1" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
      <circle cx="142" cy="248" r="7" fill="#C5A059"/>
      <circle cx="268" cy="214" r="7" fill="#C5A059"/>
      <circle cx="394" cy="198" r="7" fill="#C5A059"/>
      <circle cx="526" cy="224" r="7" fill="#C5A059"/>
      <circle cx="620" cy="236" r="7" fill="#C5A059"/>
      <g transform="translate(250 110)">
        <ellipse cx="92" cy="78" rx="86" ry="58" fill="#0F2231" stroke="#5D8FB0" stroke-width="3"/>
        <ellipse cx="92" cy="78" rx="64" ry="34" fill="none" stroke="#8FC7E8" stroke-width="2" stroke-dasharray="3 10"/>
        <ellipse cx="54" cy="69" rx="18" ry="10" fill="#C5A059"/>
        <ellipse cx="102" cy="90" rx="18" ry="10" fill="#C5A059"/>
        <ellipse cx="132" cy="62" rx="18" ry="10" fill="#C5A059"/>
      </g>
      <text x="52" y="324" fill="#FFF" font-family="Urbanist, Inter, Arial, sans-serif" font-size="28" font-weight="300" letter-spacing="1">ATP and Mitochondrial Energy</text>
      <text x="52" y="352" fill="#C5A059" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1.1">waveform + mitochondrion + research summary</text>
    </g>
  </g>
</svg>
