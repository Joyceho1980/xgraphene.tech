<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mitochondrial Dysfunction</title>
  <desc id="desc">A clean scientific illustration showing normal mitochondria moving into reduced function and persistent dysfunction with a green to amber to red color path.</desc>
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3FBF4"/>
      <stop offset="100%" stop-color="#EAF0F7"/>
    </linearGradient>
    <linearGradient id="bgR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6E4"/>
      <stop offset="100%" stop-color="#FCE9E7"/>
    </linearGradient>
    <linearGradient id="cellGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9F0DE"/>
      <stop offset="100%" stop-color="#9FD1AE"/>
    </linearGradient>
    <linearGradient id="cellAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE8B3"/>
      <stop offset="100%" stop-color="#F1C86D"/>
    </linearGradient>
    <linearGradient id="cellRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD7D7"/>
      <stop offset="100%" stop-color="#F39E9E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B1720" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#F5F1EB"/>
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1460" height="760" rx="36" fill="#FFF"/>
  </g>
  <clipPath id="clip">
    <rect x="70" y="70" width="1460" height="760" rx="36"/>
  </clipPath>
  <g clip-path="url(#clip)">
    <rect x="70" y="70" width="486" height="760" fill="url(#bgL)"/>
    <rect x="556" y="70" width="488" height="760" fill="#F6F7FA"/>
    <rect x="1044" y="70" width="486" height="760" fill="url(#bgR)"/>

    <circle cx="260" cy="195" r="76" fill="#F7D77D" opacity="0.75" filter="url(#soft)"/>
    <circle cx="1300" cy="180" r="78" fill="#F7D77D" opacity="0.32" filter="url(#soft)"/>

    <g transform="translate(128 250)">
      <circle cx="110" cy="130" r="78" fill="url(#cellGreen)" opacity="0.95"/>
      <path d="M55 130C72 102 93 92 114 108C134 123 146 123 164 108C179 95 198 102 215 128C197 156 178 166 160 152C142 138 129 139 112 153C93 167 73 160 55 130Z" fill="#2F6A4F" opacity="0.32"/>
      <ellipse cx="69" cy="104" rx="18" ry="11" fill="#2F6A4F" opacity="0.66"/>
      <ellipse cx="150" cy="149" rx="18" ry="11" fill="#2F6A4F" opacity="0.66"/>
      <ellipse cx="144" cy="88" rx="18" ry="11" fill="#2F6A4F" opacity="0.66"/>
      <circle cx="110" cy="130" r="112" fill="none" stroke="#A8D8B6" stroke-width="4" opacity="0.7"/>
    </g>

    <g transform="translate(620 250)">
      <circle cx="110" cy="130" r="78" fill="url(#cellAmber)" opacity="0.96"/>
      <path d="M58 130C77 106 96 100 116 112C135 123 148 123 165 111C181 100 201 104 216 128C201 153 183 162 163 150C144 138 130 137 114 150C97 164 75 158 58 130Z" fill="#8A6D2F" opacity="0.32"/>
      <ellipse cx="70" cy="105" rx="18" ry="11" fill="#8A6D2F" opacity="0.55"/>
      <ellipse cx="150" cy="149" rx="18" ry="11" fill="#8A6D2F" opacity="0.55"/>
      <ellipse cx="144" cy="88" rx="18" ry="11" fill="#8A6D2F" opacity="0.55"/>
      <circle cx="110" cy="130" r="112" fill="none" stroke="#F0D28B" stroke-width="4" opacity="0.7"/>
    </g>

    <g transform="translate(1120 250)">
      <circle cx="110" cy="130" r="78" fill="url(#cellRed)" opacity="0.96"/>
      <path d="M58 130C77 106 96 100 116 112C135 123 148 123 165 111C181 100 201 104 216 128C201 153 183 162 163 150C144 138 130 137 114 150C97 164 75 158 58 130Z" fill="#A54A4A" opacity="0.32"/>
      <ellipse cx="70" cy="105" rx="18" ry="11" fill="#A54A4A" opacity="0.55"/>
      <ellipse cx="150" cy="149" rx="18" ry="11" fill="#A54A4A" opacity="0.55"/>
      <ellipse cx="144" cy="88" rx="18" ry="11" fill="#A54A4A" opacity="0.55"/>
      <circle cx="110" cy="130" r="112" fill="none" stroke="#F3B5B5" stroke-width="4" opacity="0.7"/>
    </g>

    <g>
      <rect x="412" y="173" width="76" height="8" rx="4" fill="#2F6A4F" opacity="0.75"/>
      <rect x="899" y="173" width="76" height="8" rx="4" fill="#A35B21" opacity="0.75"/>
      <rect x="1387" y="173" width="76" height="8" rx="4" fill="#A54A4A" opacity="0.75"/>
      <path d="M504 177H610" stroke="#C5A059" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
      <path d="M992 177H1098" stroke="#C5A059" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    </g>

    <g transform="translate(790 560)">
      <rect x="-160" y="-70" width="320" height="140" rx="24" fill="rgba(255,255,255,0.82)" stroke="#E5E5E7"/>
      <text x="0" y="-6" text-anchor="middle" fill="#1A3348" font-family="Urbanist, Inter, Arial, sans-serif" font-size="28" font-weight="300" letter-spacing="1">
        Mitochondrial Dysfunction
      </text>
      <text x="0" y="28" text-anchor="middle" fill="#6B7280" font-family="Inter, Arial, sans-serif" font-size="14">
        Normal biology -> reduced function -> persistent strain
      </text>
      <text x="0" y="54" text-anchor="middle" fill="#C5A059" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="1.2">
        Not the same thing as disease
      </text>
    </g>
  </g>
</svg>
