    <rect x="800" y="70" width="730" height="760" fill="url(#night)"/>
    <circle cx="220" cy="162" r="82" fill="#F7D77D" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1292" cy="190" r="98" fill="#5BB7F1" opacity="0.22" filter="url(#glow)"/>

