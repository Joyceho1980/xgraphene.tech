<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">What Mitochondrial Disease Feels Like</title>
  <desc id="desc">A calm human-centered illustration showing unreliable energy, slow recovery, and multi-system strain in a quiet home setting.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7E7"/>
      <stop offset="65%" stop-color="#F4F1ED"/>
      <stop offset="100%" stop-color="#E7EEF6"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3348"/>
      <stop offset="100%" stop-color="#0E1B26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B1720" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F5F1EB"/>
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1460" height="760" rx="36" fill="#FFF"/>
  </g>
  <clipPath id="clip">
    <rect x="70" y="70" width="1460" height="760" rx="36"/>
  </clipPath>
  <g clip-path="url(#clip)">
