    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1385 378) rotate(90) scale(190 250)">
      <stop offset="0" stop-color="#F2E6C5"/>
      <stop offset="0.28" stop-color="#CDA864"/>
      <stop offset="0.6" stop-color="#4E6F8F"/>
      <stop offset="1" stop-color="#1A3247"/>
    </radialGradient>
    <radialGradient id="orbInner" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1385 378) rotate(90) scale(96 120)">
      <stop offset="0" stop-color="#FFF7E8"/>
