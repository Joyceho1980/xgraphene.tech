<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111D"/>
      <stop offset="0.55" stop-color="#0D1A29"/>
      <stop offset="1" stop-color="#132739"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1350 360) rotate(90) scale(460 640)">
      <stop offset="0" stop-color="#D8B56B" stop-opacity="0.42"/>
