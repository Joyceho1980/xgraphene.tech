<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mitochondrial Health</title>
  <desc id="desc">A clean energy diagram showing ATP production, membrane potential, and healthy mitochondrial function in a research-friendly style.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="70%" stop-color="#F3F1ED"/>
      <stop offset="100%" stop-color="#E7EEF6"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9F0DE"/>
      <stop offset="100%" stop-color="#9FD1AE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0B1720" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F5F1EB"/>
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1460" height="760" rx="36" fill="#FFF"/>
  </g>
  <clipPath id="clip">
    <rect x="70" y="70" width="1460" height="760" rx="36"/>
  </clipPath>
  <g clip-path="url(#clip)">
    <rect x="70" y="70" width="1460" height="760" fill="url(#bg)"/>
    <circle cx="1200" cy="150" r="92" fill="#F7D77D" opacity="0.38" filter="url(#soft)"/>
    <circle cx="290" cy="160" r="88" fill="#5BB7F1" opacity="0.16" filter="url(#soft)"/>

    <g transform="translate(170 230)">
      <rect x="0" y="0" width="460" height="360" rx="30" fill="#FFF" stroke="#E5E5E7"/>
      <text x="28" y="44" fill="#1A3348" font-family="Urbanist, Inter, Arial, sans-serif" font-size="28" font-weight="300" letter-spacing="1">ATP Production</text>
      <path d="M44 124H224" stroke="#C5A059" stroke-width="8" stroke-linecap="round"/>
      <path d="M224 124H402" stroke="#1A3348" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 11"/>
      <text x="44" y="104" fill="#2F6A4F" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1">FOOD + OXYGEN</text>
      <text x="216" y="104" fill="#8A6D2F" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1">MITOCHONDRIA</text>
      <text x="346" y="104" fill="#1A3348" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1">ATP / ENERGY</text>

      <rect x="44" y="156" width="372" height="26" rx="13" fill="#E8F5EA"/>
      <rect x="44" y="156" width="300" height="26" rx="13" fill="#9FD1AE"/>
      <text x="54" y="175" fill="#2F6A4F" font-family="Inter, Arial, sans-serif" font-size="12">healthy output</text>

      <rect x="44" y="214" width="372" height="26" rx="13" fill="#EEF4FB"/>
      <rect x="44" y="214" width="220" height="26" rx="13" fill="#94A3B8"/>
      <text x="54" y="233" fill="#1A3348" font-family="Inter, Arial, sans-serif" font-size="12">membrane potential</text>

      <rect x="44" y="272" width="372" height="26" rx="13" fill="#FFF2D6"/>
      <rect x="44" y="272" width="270" height="26" rx="13" fill="#F1C86D"/>
      <text x="54" y="291" fill="#8A6D2F" font-family="Inter, Arial, sans-serif" font-size="12">quality control and adaptation</text>
    </g>

    <g transform="translate(820 250)">
      <rect x="0" y="0" width="610" height="360" rx="30" fill="#1A3348"/>
      <circle cx="305" cy="180" r="120" fill="#5BB7F1" opacity="0.18" filter="url(#soft)"/>
      <circle cx="305" cy="180" r="130" fill="none" stroke="#5D8FB0" stroke-width="5" opacity="0.5"/>
      <circle cx="305" cy="180" r="98" fill="none" stroke="#8FC7E8" stroke-width="2.5" stroke-dasharray="3 10" opacity="0.55"/>
      <ellipse cx="270" cy="152" rx="24" ry="14" fill="#C5A059"/>
      <ellipse cx="336" cy="204" rx="24" ry="14" fill="#C5A059"/>
      <ellipse cx="360" cy="150" rx="24" ry="14" fill="#C5A059"/>
      <ellipse cx="242" cy="202" rx="24" ry="14" fill="#C5A059"/>
      <path d="M180 86C238 60 302 56 350 86" stroke="#C5A059" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
      <path d="M242 70C310 43 390 52 438 92" stroke="#C5A059" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
      <text x="50" y="314" fill="#FFFFFF" font-family="Urbanist, Inter, Arial, sans-serif" font-size="26" font-weight="300" letter-spacing="1">Mitochondrial Health</text>
      <text x="50" y="340" fill="#C5A059" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1.1">ATP, membrane potential, and cellular resilience</text>
    </g>
  </g>
</svg>
