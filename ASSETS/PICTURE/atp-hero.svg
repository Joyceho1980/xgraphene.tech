<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1080" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102033"/>
      <stop offset="1" stop-color="#1A3348"/>
    </linearGradient>
    <linearGradient id="gold" x1="380" y1="180" x2="820" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6C98F"/>
      <stop offset="1" stop-color="#C5A059"/>
    </linearGradient>
    <linearGradient id="panel" x1="260" y1="170" x2="940" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F6F1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#bg)"/>
  <circle cx="214" cy="160" r="120" fill="#C5A059" fill-opacity="0.12" filter="url(#blur)"/>
  <circle cx="1000" cy="660" r="160" fill="#C5A059" fill-opacity="0.10" filter="url(#blur)"/>
  <rect x="72" y="72" width="1056" height="656" rx="28" fill="url(#panel)" stroke="#E5E5E7" stroke-opacity="0.12"/>

  <g opacity="0.22">
    <path d="M192 604C270 564 344 546 416 548C494 551 560 580 622 628C695 684 768 704 856 694C921 686 978 662 1032 620" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 10"/>
    <path d="M188 260C278 244 350 254 420 286C490 318 560 336 632 334C716 332 788 306 856 256C916 212 980 196 1040 204" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 10"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="128" y="190" width="210" height="186" rx="24" fill="#F8F6F1" fill-opacity="0.08" stroke="#E5E5E7" stroke-opacity="0.18"/>
    <rect x="370" y="166" width="180" height="232" rx="24" fill="#F8F6F1" fill-opacity="0.06" stroke="#E5E5E7" stroke-opacity="0.16"/>
    <rect x="582" y="196" width="192" height="172" rx="24" fill="#F8F6F1" fill-opacity="0.08" stroke="#E5E5E7" stroke-opacity="0.18"/>
    <rect x="808" y="160" width="220" height="240" rx="24" fill="#F8F6F1" fill-opacity="0.07" stroke="#E5E5E7" stroke-opacity="0.16"/>
    <rect x="454" y="480" width="292" height="150" rx="28" fill="#F8F6F1" fill-opacity="0.08" stroke="#E5E5E7" stroke-opacity="0.18"/>
  </g>

  <g>
    <text x="184" y="236" fill="#E0E6ED" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="4">FOOD</text>
    <circle cx="238" cy="294" r="40" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M221 294H255" stroke="#C5A059" stroke-width="3" stroke-linecap="round"/>
    <path d="M238 277V311" stroke="#C5A059" stroke-width="3" stroke-linecap="round"/>
    <text x="176" y="342" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12">nutrients</text>
  </g>

  <g>
    <text x="408" y="214" fill="#E0E6ED" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="4">OXYGEN</text>
    <circle cx="462" cy="288" r="42" fill="none" stroke="#E0E6ED" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="448" cy="288" r="8" fill="#E0E6ED" fill-opacity="0.9"/>
    <circle cx="476" cy="288" r="8" fill="#E0E6ED" fill-opacity="0.9"/>
    <text x="412" y="344" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12">air / respiration</text>
  </g>

  <g>
    <text x="615" y="240" fill="#E0E6ED" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="4">MITOCHONDRIA</text>
    <ellipse cx="678" cy="294" rx="56" ry="34" fill="none" stroke="url(#gold)" stroke-width="2.8"/>
    <path d="M642 294H714" stroke="#C5A059" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M655 280L671 308" stroke="#C5A059" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M671 280L687 308" stroke="#C5A059" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M687 280L703 308" stroke="#C5A059" stroke-width="2.2" stroke-linecap="round"/>
    <text x="642" y="344" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12">energy conversion</text>
  </g>

  <g>
    <text x="865" y="206" fill="#E0E6ED" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="4">ATP</text>
    <circle cx="920" cy="292" r="58" fill="url(#gold)" fill-opacity="0.16" stroke="url(#gold)" stroke-width="2.5"/>
    <text x="883" y="301" fill="#FFFFFF" font-family="Urbanist, Inter, Arial, sans-serif" font-size="48" letter-spacing="3">ATP</text>
    <text x="840" y="344" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12">usable energy currency</text>
  </g>

  <g>
    <text x="514" y="530" fill="#E0E6ED" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="4">CELLULAR WORK</text>
    <rect x="498" y="548" width="48" height="48" rx="14" fill="none" stroke="#C5A059" stroke-width="2.5"/>
    <path d="M522 558V586" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M508 572H536" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="620" cy="572" r="18" fill="none" stroke="#E0E6ED" stroke-opacity="0.7" stroke-width="2.5"/>
    <path d="M620 560V584" stroke="#E0E6ED" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M608 572H632" stroke="#E0E6ED" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="718" cy="572" r="18" fill="none" stroke="#E0E6ED" stroke-opacity="0.7" stroke-width="2.5"/>
    <path d="M706 572H730" stroke="#E0E6ED" stroke-width="2.3" stroke-linecap="round"/>
  </g>

  <g>
    <path d="M338 286H376" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M366 278L378 286L366 294" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M556 294H594" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M584 286L596 294L584 302" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M756 294H796" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M786 286L798 294L786 302" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M742 572H868" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M856 564L868 572L856 580" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="96" y="742" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="2">FOOD + OXYGEN -> MITOCHONDRIA -> ATP -> CELLULAR WORK</text>
</svg>
