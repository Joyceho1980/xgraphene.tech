<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="140" y1="80" x2="1460" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F2032"/>
      <stop offset="1" stop-color="#1A3348"/>
    </linearGradient>
    <linearGradient id="gold" x1="440" y1="180" x2="1160" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9D39B"/>
      <stop offset="1" stop-color="#C5A059"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="240" cy="180" r="160" fill="#C5A059" fill-opacity="0.10" filter="url(#blur)"/>
  <circle cx="1380" cy="720" r="180" fill="#4CC1FF" fill-opacity="0.08" filter="url(#blur)"/>
  <circle cx="1280" cy="180" r="110" fill="#C5A059" fill-opacity="0.10" filter="url(#blur)"/>

  <g opacity="0.16" stroke="#FFFFFF">
    <path d="M250 560C400 480 520 450 640 452C760 454 882 495 996 560C1110 625 1230 666 1390 640" stroke-width="1.5" stroke-dasharray="2 12"/>
    <path d="M360 300C480 260 578 252 680 265C792 280 900 327 1000 380C1110 438 1232 468 1390 462" stroke-width="1.5" stroke-dasharray="2 12"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="800" cy="450" r="150" fill="rgba(255,255,255,0.04)" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="800" cy="450" r="88" fill="none" stroke="#E0E6ED" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="800" cy="450" r="44" fill="url(#gold)" fill-opacity="0.16" stroke="url(#gold)" stroke-width="2.5"/>
    <text x="760" y="456" fill="#FFFFFF" font-family="Urbanist, Inter, Arial, sans-serif" font-size="42" letter-spacing="2">CARE</text>
    <text x="721" y="492" fill="#C5A059" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3">MANAGEMENT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="334" y="168" width="230" height="150" rx="22" fill="#F8F6F1" fill-opacity="0.08" stroke="#E5E5E7" stroke-opacity="0.16"/>
    <rect x="1036" y="168" width="230" height="150" rx="22" fill="#F8F6F1" fill-opacity="0.08" stroke="#E5E5E7" stroke-opacity="0.16"/>
    <rect x="248" y="582" width="230" height="150" rx="22" fill="#F8F6F1" fill-opacity="0.08" stroke="#E5E5E7" stroke-opacity="0.16"/>
    <rect x="1118" y="582" width="230" height="150" rx="22" fill="#F8F6F1" fill-opacity="0.08" stroke="#E5E5E7" stroke-opacity="0.16"/>
  </g>

  <g>
    <text x="404" y="214" fill="#E0E6ED" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="4">NUTRITION</text>
    <circle cx="450" cy="248" r="28" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M450 226V270" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M428 248H472" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/>
    <text x="390" y="288" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12">fuel, supplements, support</text>
  </g>

  <g>
    <text x="1108" y="214" fill="#E0E6ED" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="4">REHAB</text>
    <circle cx="1160" cy="248" r="28" fill="none" stroke="#4CC1FF" stroke-width="2.5"/>
    <path d="M1148 248H1172" stroke="#4CC1FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1160 236V260" stroke="#4CC1FF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1098" y="288" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12">gentle activity and therapy</text>
  </g>

  <g>
    <text x="322" y="627" fill="#E0E6ED" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="4">MONITORING</text>
    <circle cx="386" cy="662" r="28" fill="none" stroke="#C5A059" stroke-width="2.5"/>
    <path d="M372 664L381 673L400 651" stroke="#C5A059" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="294" y="702" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12">heart, lungs, nerves, labs</text>
  </g>

  <g>
    <text x="1188" y="627" fill="#E0E6ED" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="4">QUALITY OF LIFE</text>
    <circle cx="1236" cy="662" r="28" fill="none" stroke="#E0E6ED" stroke-opacity="0.85" stroke-width="2.5"/>
    <path d="M1236 648V676" stroke="#E0E6ED" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1222 662H1250" stroke="#E0E6ED" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1164" y="702" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12">adaptation and support</text>
  </g>

  <text x="120" y="842" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="2">MANAGEMENT = SYMPTOM CONTROL + SUPPORT + MONITORING + ADAPTATION</text>
</svg>
